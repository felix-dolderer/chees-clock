<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Chess Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock">
    <button class="side top" id="black" aria-label="Black's clock">
      <span class="label">Black</span>
      <span class="time">05:00</span>
      <span class="moves">Moves: 0</span>
      <span class="penalty">⚡ 15% faster this turn</span>
    </button>

    <div class="controls">
      <select id="preset" aria-label="Time control">
        <option value="60|0">1 min</option>
        <option value="180|2">3 + 2</option>
        <option value="300|0" selected>5 min</option>
        <option value="600|0">10 min</option>
        <option value="900|10">15 + 10</option>
        <option value="1800|0">30 min</option>
      </select>
      <button id="fun" aria-label="Fun mode" aria-pressed="false" title="Fun mode: each turn a random side's clock runs 15% faster">🎲</button>
      <button id="pause" aria-label="Pause">⏸</button>
      <button id="reset" aria-label="Reset">↺</button>
    </div>

    <button class="side bottom" id="white" aria-label="White's clock">
      <span class="label">White</span>
      <span class="time">05:00</span>
      <span class="moves">Moves: 0</span>
      <span class="penalty">⚡ 15% faster this turn</span>
    </button>
  </main>
  <script src="app.js"></script>
</body>
</html>
